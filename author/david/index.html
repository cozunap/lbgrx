<!DOCTYPE html>
<html>
	<head>
<script>
(function(){
  try {
    var p = window.location.pathname;
    if (p.indexOf('/es/') !== 0 && p !== '/es') {
      var pref = localStorage.getItem('lbgrx_lang_pref');
      var lang = (navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language || '').toLowerCase();
      if (lang.indexOf('es') === 0 && pref !== 'en') {
        localStorage.setItem('lbgrx_lang_pref', 'es');
        var target = p === '/' ? '/es/' : ('/es' + p);
        window.location.replace(target + (window.location.search || '') + (window.location.hash || ''));
      }
    }
  } catch(e) {}
})();
</script>
		<title>Redirecting...</title>
							<meta http-equiv="refresh" content="0;url=/">
				<link rel="stylesheet" href="/assets/custom.css">
</head>
	<body>
							<script type="text/javascript">
					window.location.assign("\/");
				</script>
			
							<p>You are being redirected to <a href="/">/</a></p>
				<script src="/assets/custom.js" defer></script>
</body>
</html>
